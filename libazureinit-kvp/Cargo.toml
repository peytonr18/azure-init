[package]
name = "libazureinit-kvp"
version = "0.1.0"
edition = "2021"
rust-version.workspace = true
repository = "https://github.com/Azure/azure-init/"
homepage = "https://github.com/Azure/azure-init/"
license = "MIT"
description = "Hyper-V KVP (Key-Value Pair) storage library for azure-init."

[dependencies]
base64 = "0.23"
chrono = { version = "0.4", default-features = false, features = ["clock", "serde", "std"] }
clap = { version = "4.5.21", features = ["derive"] }
csv = "1"
flate2 = "1.0"
libc = "0.2"
reqwest = { version = "0.13.1", default-features = false, features = ["blocking"], optional = true }
serde = { version = "1.0", features = ["derive"] }
serde-xml-rs = { version = "0.8.0", optional = true }
serde_json = "1.0.96"
thiserror = { version = "2.0.3", optional = true }
tracing = "0.1.40"
uuid.workspace = true

[features]
default = []
wireserver = ["dep:reqwest", "dep:serde-xml-rs", "dep:thiserror"]

[dev-dependencies]
rstest = { version = "0.28", default-features = false }
tempfile = "3"

[lib]
name = "libazureinit_kvp"
path = "src/lib.rs"
